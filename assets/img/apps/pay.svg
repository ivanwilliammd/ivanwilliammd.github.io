<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="pay.meditechku">
  <!--
    Lambang pay.meditechku: kartu pembayaran dengan denyut nadi di dalamnya.

    Dua hal yang dijual layanan ini ada di satu tanda - kartu (pembayaran) dan garis nadi (kesehatan,
    ekosistem Meditechku). Gradien cyan ke violet sama dengan tombol dan kartu masuk yang sudah
    dipakai, jadi lambang ini tidak terasa sebagai tempelan baru.

    Ukuran kecil: garis memakai 4 satuan dari 64 (1:16). Pada 16px itu menjadi 1px - masih terlihat,
    karena bentuknya garis tunggal tanpa detail bercabang. Latar gradien penuh supaya kartu putih di
    dalamnya tetap punya kontras saat dipasang di tab, favicon, atau kartu 42px.
  -->
  <defs>
    <linearGradient id="payGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#payGrad)"/>

  <!-- Kartu -->
  <rect x="11" y="21" width="42" height="26" rx="6" fill="none" stroke="#ffffff" stroke-width="4"/>

  <!-- Garis nadi yang berjalan melintasi kartu -->
  <path d="M15 34h7l3.5-6 4.5 12 3.5-6h15.5"
        fill="none" stroke="#ffffff" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
