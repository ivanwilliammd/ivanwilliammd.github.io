<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="link.ivai.app">
  <!--
    Favicon link.ivai.app - gambar yang BERBEDA, bukan mark yang diperkecil.

    Pada 16-32px rantai dan finder berlapis melebur menjadi satu bintik, jadi hanya finder yang
    dipakai - dan dengan satuan u=12px (rasio 1:1:3:1:1, jejak 84px). Pada 16px itu menjadi
    cincin 1,5px | celah 1,5px | inti 4,5px: struktur yang masih terhitung sebagai deret
    terang-gelap-terang, bukan bidang putih penuh.
  -->
  <rect x="0" y="0" width="128" height="128" rx="26" ry="26" fill="#25c69d"/>
  <rect x="28" y="28" width="72" height="72" rx="3" ry="3" fill="none" stroke="#ffffff" stroke-width="12"/>
  <rect x="46" y="46" width="36" height="36" rx="3" ry="3" fill="#ffffff"/>
</svg>
