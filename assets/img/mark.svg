<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="IvanMD mark: data pulse">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2bcca6"/>
      <stop offset="0.55" stop-color="#1cae8c"/>
      <stop offset="1" stop-color="#086a54"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#g)"/>
  <!-- Denyut: satu garis, tiga simpul. Terbaca sebagai data klinis, bukan huruf. -->
