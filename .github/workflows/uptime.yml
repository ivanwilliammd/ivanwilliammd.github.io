name: Uptime

# Ping setiap layanan tiap 15 menit dan tulis status.json + data/history.json.
# Halaman pit stop membaca status.json itu; tidak ada server tambahan.

on:
  # Jaring pengaman saja. Jadwal rapat di Actions bersifat best-effort: */15 pada repo
  # ini nyatanya berjalan tiap 2,8–7 jam. Pinger sebenarnya ada di cron VPS
  # (scripts/uptime-cron.sh, tiap 15 menit). Jangan dikembalikan ke */15 — hasilnya
  # hanya riwayat bolong yang tampak rapi.
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uptime
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping every service
        run: python3 scripts/uptime.py

      - name: Commit status if changed
        run: |
          if git diff --quiet status.json data/history.json; then
            echo "Tidak ada perubahan."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json data/history.json
          git commit -m "uptime: refresh status"
          git push
